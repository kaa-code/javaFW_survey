# アプリケーション名
spring.application.name=survey

# ========== データベース接続設定 ==========
spring.datasource.url=jdbc:mysql://localhost:3307/jf_customer_survey?useSSL=false&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== Thymeleaf 設定 ==========
# テンプレートをキャッシュしない（開発中はリロードで反映させるため）
spring.thymeleaf.cache=false